<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ESP32 Ambient</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

    <h1>ESP32 Ambient</h1>

    <button id="connect">
        Verbinden
    </button>

    <p id="status">
        Nicht verbunden
    </p>

</div>

<div class="card">

    <h2>Farbe</h2>

    <input
        type="color"
        id="colorPicker"
        value="#ff0000">

</div>

<div class="card">

    <h2>Helligkeit</h2>

    <input
        type="range"
        id="brightness"
        min="0"
        max="255"
        value="150">

    <span id="brightnessValue">
        150
    </span>

</div>

<div class="card">

    <h2>LED-Streifen</h2>

    <select id="strip">

        <option value="0">
            Alle
        </option>

        <option value="1">
            Vorne Links
        </option>

        <option value="2">
            Vorne Rechts
        </option>

        <option value="3">
            Hinten Links
        </option>

        <option value="4">
            Hinten Rechts
        </option>

    </select>

</div>

<div class="card">

    <h2>Effekte</h2>

    <button class="effect" data-effect="0">
        Statisch
    </button>

    <button class="effect" data-effect="1">
        Rainbow
    </button>

    <button class="effect" data-effect="2">
        Atmen
    </button>

    <button class="effect" data-effect="3">
        Police
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
